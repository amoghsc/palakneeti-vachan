<!doctype html>
<html lang="mr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>वाचनकक्ष आकडे</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --paper: #fbf9f4; --card: #ffffff; --ink: #1f1e1c; --ink-2: #57534c; --ink-3: #8d887e; --rule: #e6e1d6; --accent: #5b4a8a; --accent-soft: #e9e4f3; --warn: #a2512f; }
    @media (prefers-color-scheme: dark) {
      :root { --paper: #181715; --card: #211f1c; --ink: #ece7dc; --ink-2: #bdb6a8; --ink-3: #8a8478; --rule: #34312c; --accent: #a796d8; --accent-soft: #2e2840; --warn: #e08b65; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 Mukta, system-ui, sans-serif; }
    a { color: inherit; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 60px; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 14px; }
    h1 { font-size: 26px; font-weight: 600; margin: 0; }
    h1 small { font-size: 15px; font-weight: 400; color: var(--ink-3); margin-left: 8px; }
    .ranges { display: flex; border: 1px solid var(--rule); }
    .ranges button { font: inherit; font-size: 14px; padding: 4px 12px; border: 0; background: none; color: var(--ink-2); cursor: pointer; }
    .ranges button + button { border-left: 1px solid var(--rule); }
    .ranges button.on { background: var(--ink); color: var(--paper); }
    .who { font-size: 13px; color: var(--ink-3); }
    .who button { font: inherit; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0 0 0 6px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 22px 0; }
    .tile { background: var(--card); border: 1px solid var(--rule); padding: 14px 16px; }
    .tile b { display: block; font-size: 30px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .tile span { font-size: 14px; color: var(--ink-2); }
    .tile em { display: block; font-style: normal; font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    section.box { background: var(--card); border: 1px solid var(--rule); padding: 16px 18px; margin-bottom: 16px; min-width: 0; }
    section.box h2 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
    section.box h2 small { font-weight: 400; color: var(--ink-3); font-size: 13px; margin-left: 6px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    td { padding: 6px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
    td.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink-2); padding-left: 12px; }
    tr:last-child td { border-bottom: 0; }
    .bar { height: 6px; background: var(--accent); margin-top: 3px; min-width: 2px; }
    .zero { color: var(--warn); font-size: 12.5px; margin-left: 6px; }
    .empty { color: var(--ink-3); font-size: 14px; margin: 4px 0; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart text { font: 11px Mukta, sans-serif; fill: var(--ink-3); }
    .legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); margin-bottom: 6px; }
    .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
    .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px; padding: 4px 8px; display: none; z-index: 5; }
    form.login { max-width: 340px; margin: 12vh auto; background: var(--card); border: 1px solid var(--rule); padding: 24px; }
    form.login h1 { margin-bottom: 4px; }
    form.login p { color: var(--ink-2); font-size: 14px; margin: 0 0 16px; }
    form.login input { width: 100%; font: inherit; padding: 8px 10px; margin-bottom: 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
    form.login button { width: 100%; font: inherit; padding: 9px; background: var(--accent); color: #fff; border: 0; cursor: pointer; }
    .err { color: var(--warn); font-size: 14px; min-height: 1.4em; margin: 6px 0 0; }
    .note { font-size: 13px; color: var(--ink-3); margin-top: 24px; }
    .loading { color: var(--ink-3); margin: 40px 0; }
  </style>
</head>
<body>
  <div id="app" class="wrap"><p class="loading">उघडत आहे…</p></div>
  <div class="tip" id="tip"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script type="module">
    import { SUPABASE_URL, SUPABASE_ANON } from './js/track.js';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { storageKey: 'pk-stats-auth' } });
    const $app = document.getElementById('app'), $tip = document.getElementById('tip');
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const DIG = '०१२३४५६७८९';
    const mr = n => String(n).replace(/\d/g, d => DIG[d]);
    const num = n => mr(Number(n || 0).toLocaleString('en-IN'));
    const SITE = './';

    const RANGES = [['today', 'आज'], ['7', '७ दिवस'], ['30', '३० दिवस'], ['90', '९० दिवस'], ['all', 'सगळे']];
    let range = localStorage.getItem('pk-stats-range') || '30';
    function since() {
      if (range === 'all') return new Date('2026-01-01').toISOString();
      const d = new Date();
      if (range === 'today') { d.setHours(0, 0, 0, 0); return d.toISOString(); }
      d.setDate(d.getDate() - +range); return d.toISOString();
    }

    const SECTION = { home: 'मुखपृष्ठ', article: 'लेख', masik: 'मासिक (सर्व अंक)', issue: 'एक अंक', authors: 'लेखक (यादी)', author: 'एक लेखक',
      topics: 'विषय', topic: 'एक विषय', graph: 'जाळं' };
    const FEATURE = { pdf: 'PDF डाउनलोड', view_toggle: 'अनुक्रम दृश्य', theme: 'रंगसंगती', font: 'अक्षराचा आकार' };
    const FLABEL = { list: 'यादी', cards: 'कार्ड', light: 'दिवस', sepia: 'सेपिया', dark: 'रात्र', bigger: 'मोठे', smaller: 'लहान' };

    function login(msg = '') {
      $app.className = '';
      $app.innerHTML = `<form class="login"><h1>वाचनकक्ष आकडे</h1><p>shelfie खात्याने प्रवेश करा.</p>
        <input type="email" name="email" placeholder="email" autocomplete="username" required>
        <input type="password" name="password" placeholder="password" autocomplete="current-password" required>
        <button>उघडा</button><p class="err">${esc(msg)}</p></form>`;
      $app.querySelector('form').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const { error } = await sb.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
        if (error) return login('प्रवेश झाला नाही: ' + error.message);
        load();
      };
    }

    async function load() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return login();
      $app.className = 'wrap';
      if (!$app.querySelector('header')) $app.innerHTML = '<p class="loading">आकडे आणत आहे…</p>';
      const { data, error } = await sb.rpc('pk_stats', { since: since() });
      if (error) {
        if (/not allowed/.test(error.message)) { await sb.auth.signOut(); return login('हे खाते आकडे पाहू शकत नाही.'); }
        $app.innerHTML = `<p class="err">आकडे आणता आले नाहीत: ${esc(error.message)}</p>`; return;
      }
      render(data, session.user.email);
    }

    function table(rows, cols, empty = 'अजून काही नाही.') {
      if (!rows.length) return `<p class="empty">${empty}</p>`;
      const max = Math.max(...rows.map(r => +r[cols.bar] || 0), 1);
      return `<table>${rows.map(r => `<tr><td>${cols.name(r)}<div class="bar" style="width:${(100 * (+r[cols.bar] || 0) / max).toFixed(1)}%"></div></td>
        ${cols.nums.map(k => `<td class="n">${num(r[k])}</td>`).join('')}</tr>`).join('')}</table>`;
    }

    // Daily visitors (bars) and page views (line), with a hover readout.
    function dailyChart(days) {
      if (!days.length) return '<p class="empty">अजून काही नाही.</p>';
      const W = 640, H = 170, L = 30, B = 22, T = 8;
      const max = Math.max(...days.map(d => Math.max(d.visitors, d.views)), 1);
      const step = (W - L) / days.length, bw = Math.max(2, Math.min(28, step * 0.62));
      const y = v => T + (H - T - B) * (1 - v / max);
      const x = i => L + step * i + step / 2;
      const ticks = [0, Math.round(max / 2), max];
      const every = Math.ceil(days.length / 8);
      const fmt = s => { const d = new Date(s); return mr(d.getDate()) + '/' + mr(d.getMonth() + 1); };
      return `<div class="legend"><span><i style="background:var(--accent-soft);outline:1px solid var(--accent)"></i>वाचक</span><span><i style="background:var(--accent)"></i>पाने उघडली</span></div>
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="रोजचे वाचक आणि पाने">
        ${ticks.map(t => `<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--rule)"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${mr(t)}</text>`).join('')}
        ${days.map((d, i) => `<rect x="${x(i) - bw / 2}" y="${y(d.visitors)}" width="${bw}" height="${H - B - y(d.visitors)}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width=".6"/>`).join('')}
        <polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${days.map((d, i) => `${x(i)},${y(d.views)}`).join(' ')}"/>
        ${days.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.views)}" r="2.6" fill="var(--accent)"/>`).join('')}
        ${days.map((d, i) => i % every === 0 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${fmt(d.day)}</text>` : '').join('')}
        ${days.map((d, i) => `<rect class="hit" data-i="${i}" x="${L + step * i}" y="0" width="${step}" height="${H - B}" fill="transparent"/>`).join('')}
      </svg>`;
    }
    function hourChart(hours) {
      const by = new Map(hours.map(h => [h.hour, h.views]));
      const max = Math.max(...hours.map(h => h.views), 1);
      const W = 640, H = 90, B = 18, step = W / 24;
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="तासानुसार पाने">
        ${Array.from({ length: 24 }, (_, h) => { const v = by.get(h) || 0, bh = (H - B - 4) * v / max;
          return `<rect x="${h * step + 2}" y="${H - B - bh}" width="${step - 4}" height="${bh}" fill="var(--accent)"><title>${mr(h)}:०० — ${num(v)} पाने</title></rect>
          ${h % 3 === 0 ? `<text x="${h * step + step / 2}" y="${H - 4}" text-anchor="middle">${mr(h)}</text>` : ''}`; }).join('')}
      </svg>`;
    }

    function render(s, email) {
      const label = RANGES.find(r => r[0] === range)[1];
      const share = (a, b) => b ? mr(Math.round(100 * a / b)) + '%' : '—';
      $app.innerHTML = `
        <header><h1>वाचनकक्ष आकडे <small>${esc(label)}</small></h1>
          <div class="ranges">${RANGES.map(([k, t]) => `<button data-r="${k}" class="${k === range ? 'on' : ''}">${t}</button>`).join('')}</div>
          <div class="who">${esc(email)}<button id="out">बाहेर पडा</button></div></header>
        <div class="tiles">
          <div class="tile"><b>${num(s.visitors)}</b><span>वाचक</span><em>${num(s.new_visitors)} नवे</em></div>
          <div class="tile"><b>${num(s.sessions)}</b><span>भेटी</span><em>प्रति वाचक ${s.visitors ? mr((s.sessions / s.visitors).toFixed(1)) : '—'}</em></div>
          <div class="tile"><b>${num(s.views)}</b><span>पाने उघडली</span><em>प्रति भेट ${s.sessions ? mr((s.views / s.sessions).toFixed(1)) : '—'}</em></div>
          <div class="tile"><b>${num(s.searches)}</b><span>शोध</span><em>${num(s.search_clicks)} वेळा निकाल उघडला</em></div>
          <div class="tile"><b>${num(s.ai)}</b><span>AI सुचवण्या</span><em>${share(s.ai_ok, s.ai)} मध्ये लेख मिळाले · ${num(s.ai_clicks)} उघडले</em></div>
          <div class="tile"><b>${num(s.pdf)}</b><span>PDF डाउनलोड</span></div>
        </div>
        <section class="box chart"><h2>रोजचे वाचक</h2>${dailyChart(s.daily)}</section>
        <div class="grid2">
          <section class="box"><h2>कोणती पाने <small>पाने · वाचक</small></h2>
            ${table(s.sections, { bar: 'views', nums: ['views', 'visitors'], name: r => esc(SECTION[r.section] || r.section) })}</section>
          <section class="box chart"><h2>दिवसातील वेळ <small>भारतीय वेळ</small></h2>${hourChart(s.hours)}</section>
        </div>
        <section class="box"><h2>सर्वाधिक वाचलेले लेख <small>पाने · वाचक</small></h2>
          ${table(s.articles, { bar: 'views', nums: ['views', 'visitors'], name: r => `<a href="${SITE}#/a/${esc(r.ref)}" target="_blank">${esc(r.title || '#' + r.ref)}</a>` })}</section>
        <div class="grid2">
          <section class="box"><h2>शोधलेले शब्द <small>किती वेळा</small></h2>
            ${table(s.queries, { bar: 'times', nums: ['times'], name: r => `${esc(r.q)}${r.fewest === 0 ? '<span class="zero">काही सापडलं नाही</span>' : ''}` })}</section>
          <div>
            <section class="box"><h2>अंक</h2>
              ${table(s.issues, { bar: 'views', nums: ['views'], name: r => `<a href="${SITE}#/masik/${esc(r.ref)}" target="_blank">${esc(r.title || r.ref)}</a>` })}</section>
            <section class="box"><h2>लेखक पाने</h2>
              ${table(s.authors, { bar: 'views', nums: ['views'], name: r => esc(r.name || r.ref) })}</section>
          </div>
        </div>
        <div class="grid2">
          <section class="box"><h2>उपकरण <small>वाचक</small></h2>
            ${table(s.devices, { bar: 'visitors', nums: ['visitors'], name: r => ({ mobile: 'मोबाईल', tablet: 'टॅबलेट', desktop: 'संगणक' }[r.device] || r.device) })}</section>
          <section class="box"><h2>कुठून आले <small>भेटी</small></h2>
            ${table(s.referrers, { bar: 'sessions', nums: ['sessions'], name: r => esc(r.referrer) }, 'थेट भेटी किंवा माहिती नाही.')}</section>
          <section class="box"><h2>वापरलेल्या सोयी</h2>
            ${table(s.features, { bar: 'times', nums: ['times'], name: r => esc(FEATURE[r.kind] + (r.label && r.kind !== 'pdf' ? ' — ' + (FLABEL[r.label] || r.label) : r.kind === 'pdf' && r.label ? ' — ' + r.label : '')) })}</section>
        </div>
        <p class="note">वाचक = एका ब्राउझरमधला निनावी क्रमांक (IP, नाव किंवा AI ला लिहिलेला मजकूर साठवला जात नाही). एकच व्यक्ती दोन उपकरणांवरून आली तर दोन वाचक मोजले जातात. स्थानिक (localhost) भेटी मोजल्या जात नाहीत.</p>`;

      $app.querySelectorAll('.ranges button').forEach(b => b.onclick = () => { range = b.dataset.r; localStorage.setItem('pk-stats-range', range); load(); });
      $app.querySelector('#out').onclick = async () => { await sb.auth.signOut(); login(); };
      $app.querySelectorAll('.chart .hit').forEach(r => {
        r.onmousemove = e => { const d = s.daily[+r.dataset.i];
          $tip.textContent = `${new Date(d.day).toLocaleDateString('mr-IN', { day: 'numeric', month: 'short' })}: ${num(d.visitors)} वाचक · ${num(d.views)} पाने · ${num(d.searches)} शोध`;
          $tip.style.display = 'block'; $tip.style.left = Math.min(e.clientX + 12, innerWidth - 260) + 'px'; $tip.style.top = e.clientY + 14 + 'px'; };
        r.onmouseleave = () => { $tip.style.display = 'none'; };
      });
    }

    // Layout check on a local copy without signing in: stats.html?demo
    if (location.hostname === 'localhost' && new URLSearchParams(location.search).has('demo')) {
      const day = i => new Date(Date.now() - i * 864e5).toISOString().slice(0, 10);
      const daily = Array.from({ length: 30 }, (_, i) => { const v = 20 + Math.round(15 * Math.sin(i / 3) + i); return { day: day(29 - i), visitors: v, views: v * 3, searches: Math.round(v / 4) }; });
      render({ visitors: 412, new_visitors: 300, sessions: 690, views: 2480, searches: 210, search_clicks: 120, ai: 64, ai_ok: 58, ai_clicks: 71, pdf: 33, daily,
        hours: Array.from({ length: 24 }, (_, h) => ({ hour: h, views: Math.round(60 + 50 * Math.sin((h - 6) / 4)) })),
        sections: [{ section: 'article', views: 1300, visitors: 300 }, { section: 'home', views: 600, visitors: 380 }, { section: 'masik', views: 240, visitors: 120 }, { section: 'issue', views: 200, visitors: 90 }],
        articles: [{ ref: '27644', title: 'मरण', views: 90, visitors: 70 }, { ref: '21920', title: 'अभ्यासात मागे', views: 60, visitors: 52 }],
        issues: [{ ref: '27650', title: 'ऑगस्ट २०२५', views: 40 }], authors: [{ ref: 'x', name: 'वैशाली गेडाम', views: 12 }],
        queries: [{ q: 'palak', times: 14, fewest: 8 }, { q: 'zzqx', times: 2, fewest: 0 }],
        devices: [{ device: 'mobile', visitors: 300 }, { device: 'desktop', visitors: 112 }], referrers: [{ referrer: 'l.facebook.com', sessions: 40 }],
        features: [{ kind: 'pdf', label: 'ऑगस्ट २०२५', times: 12 }, { kind: 'theme', label: 'dark', times: 9 }] }, 'demo@local');
    } else load();
  </script>
</body>
</html>
